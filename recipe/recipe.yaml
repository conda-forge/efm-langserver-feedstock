schema_version: 1

context:
  version: "0.0.57"

package:
  name: efm-langserver
  version: ${{ version }}

source:
  url: https://github.com/mattn/efm-langserver/archive/v${{ version }}.tar.gz
  sha256: 5a00742ab59c146514f652cc1d8cd34df1b0b1c692706261e4a97131f9cbe935

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - efm-langserver --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: General purpose Language Server
  homepage: https://github.com/mattn/efm-langserver
  repository: https://github.com/mattn/efm-langserver

extra:
  recipe-maintainers:
    - danielnachun
